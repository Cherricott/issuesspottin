<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111827">
  <meta name="robots" content="noindex">
  <title>Review Issue Spotting</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <h1>Review Issue Spotting</h1>
    <div id="who" class="who" hidden>
      <span class="who-label">Người review</span>
      <strong id="whoName"></strong>
      <button id="logoutBtn" class="link-button" type="button">Đổi ID</button>
    </div>
  </header>

  <main>
    <!-- Đăng nhập -->
    <section id="login" class="login-panel">
      <h2>Nhập ID để bắt đầu</h2>
      <p class="hint">Mỗi người có một ID riêng và một bộ câu cố định.</p>
      <form id="loginForm" autocomplete="off">
        <input id="idInput" type="password" placeholder="ID của bạn" aria-label="ID người review" spellcheck="false">
        <button id="loginBtn" class="button primary" type="submit">Vào</button>
      </form>
      <p id="loginMsg" class="login-msg" role="alert"></p>
    </section>

    <!-- Làm việc -->
    <section id="workspace" hidden>
      <div class="toolbar" role="region" aria-label="Lưu và mở file feedback">
        <div class="file-state">
          <span id="fileDot" class="dot"></span>
          <span id="fileText">Chưa chọn file lưu</span>
        </div>
        <div class="toolbar-actions">
          <button id="pickFileBtn" class="button secondary" type="button">Chọn file lưu</button>
          <button id="openFileBtn" class="button secondary" type="button">Mở file để làm tiếp</button>
          <button id="downloadBtn" class="button secondary" type="button">Tải file feedback</button>
          <button id="nextBtn" class="button primary" type="button">Câu chưa làm tiếp theo ↓</button>
        </div>
        <div class="progress" aria-hidden="true"><div id="progressBar"></div></div>
        <input id="fileInput" type="file" accept=".jsonl,.json,.txt,application/json" hidden>
      </div>
      <p id="notice" class="notice" role="status"></p>
      <div id="cards" class="cards"></div>
      <p id="allDone" class="all-done" hidden>Bạn đã lưu tất cả các câu. Cảm ơn bạn!</p>
    </section>
  </main>

  <template id="cardTemplate">
    <article class="card">
      <div class="card-head">
        <div>
          <span class="badge category"></span>
          <span class="badge level"></span>
        </div>
        <span class="question-id"></span>
      </div>
      <div class="facts"></div>
      <div class="issues-head">
        <h3>Issue trong đáp án</h3>
        <p class="hint">Ô để trống = issue đúng. Issue sai thì viết lại issue đúng vào ô.</p>
      </div>
      <div class="issue-list"></div>
      <div class="added-list"></div>
      <button class="button ghost add-issue" type="button">+ Thêm issue</button>
      <label class="note-label">Ghi chú (không bắt buộc)
        <textarea class="note" rows="2" placeholder="Ghi chú thêm nếu cần"></textarea>
      </label>
      <div class="card-foot">
        <button class="button primary save" type="button">Lưu câu này</button>
        <span class="saved-state"></span>
      </div>
    </article>
  </template>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
